name: deploy-api

# Pipeline: verify (lint + test) -> production-gated deploy (GHCR -> VPS over tunnel).
# The `production` environment requires the owner's manual approval before the
# deploy step runs — the "hold deployment" discipline from HANDOFF.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/docker/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-api:latest

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  build-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production          # <-- THE GATE: pauses here until you approve
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared (for tunnel SSH)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy over Cloudflare Tunnel SSH
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf 'Host redcase-vps\n  HostName ssh.redcase.xyz\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  ProxyCommand cloudflared access ssh --hostname %%h\n' > ~/.ssh/config
          ssh redcase-vps "docker compose -f /opt/redcase/docker-compose.yml pull && docker compose -f /opt/redcase/docker-compose.yml up -d && docker ps --filter name=redcase-api --format '{{.Status}}'"