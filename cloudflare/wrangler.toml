# RedCase Cron Worker — Cloudflare (Task 1.7 step 5).
#
# Single cron trigger to stay within the account's free-plan cron limit
# (max 5 per account). The worker gates the daily 06:00 UTC sweep internally,
# and the health keep-alive runs every tick (5 min, superseding */10):
#   */5 * * * *  -> GET  {API_BASE_URL}/v1/health            (every tick)
#                   POST {API_BASE_URL}/v1/internal/sweep    (at 06:00 UTC)
#
# The sweep token is a WORKER SECRET, not a var:
#   wrangler secret put INTERNAL_SWEEP_TOKEN
name = "redcase-cron"
main = "worker.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/5 * * * *"]

# Non-secret only. API_BASE_URL points at the Cloudflare-proxied api. host.
[vars]
API_BASE_URL = "https://api.redcase.xyz"
