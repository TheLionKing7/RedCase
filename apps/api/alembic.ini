# Alembic configuration — RedCase API (Task 1.2).
# DDL lives in infra/supabase/migrations per HANDOFF.md 1; this file only
# points at it. The DB URL is always taken from the DATABASE_URL env var
# (never hardcoded, never committed — HANDOFF.md 3).

[alembic]
script_location = %(here)s/../../infra/supabase/migrations
prepend_sys_path = .
# timezone =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
