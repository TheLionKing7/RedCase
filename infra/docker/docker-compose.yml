services:
  api:
    image: ghcr.io/thelionking7/redcase-api:latest
    container_name: redcase-api
    env_file: /opt/redcase/.env
    ports:
      - "127.0.0.1:8000:8000"   # localhost only — tunnel carries external traffic
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3